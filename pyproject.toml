[project]
name = "flightpulse"
version = "0.1.0"
description = "Batch ELT pipeline for flight delay analytics"
authors = [{name = "Ananya Gullapally"}]
requires-python = ">=3.11"

dependencies = [
    "duckdb",
    "pandas",
    "requests",
    "streamlit",
    "dbt-duckdb"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ingestion*"]
exclude = ["data*", "dashboard*", "flightpulse_dbt*", "tests*"]
